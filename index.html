<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Catálogo Orbita 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F2F66;--ink2:#4A4866;--mute:#8C8AA3;--paper:#FBF9F5;--accent:#F39C12;--line:#ECE8E0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;box-shadow:0 2px 12px rgba(22,20,58,.25)}
.top .wrap{display:flex;align-items:center;gap:14px;height:58px}
.logo{font-weight:900;font-size:24px;letter-spacing:-.04em;flex:none}
.logo i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:2px}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;padding:8px 13px;border-radius:20px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.75);white-space:nowrap;display:flex;align-items:center;gap:7px}
.jump a .d{width:8px;height:8px;border-radius:50%}
.jump a.on{background:#fff;color:var(--ink)}
.tb{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center}
.tb svg{width:20px;height:20px}
.sbox{display:none;padding:0 20px 12px}
.sbox.on{display:block}
.sbox input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:0;border-radius:12px;outline:none}

/* hero */
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden;padding:46px 0 52px}
.hero .orb{position:absolute;right:-120px;top:-60px;width:520px;opacity:.17}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.32em;color:rgba(255,255,255,.7)}
.wordmark{font-weight:900;font-size:clamp(64px,10vw,120px);letter-spacing:-.045em;line-height:.9;margin-top:14px}
.wordmark i{display:inline-block;width:.14em;height:.14em;border-radius:50%;background:var(--accent);margin-left:.04em}
.hero p{font-size:19px;font-weight:300;color:rgba(255,255,255,.85);margin-top:14px;max-width:560px}
.stats{display:flex;gap:34px;margin-top:30px}
.stats b{display:block;font-size:34px;font-weight:800}
.stats span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)}

/* sections */
.feat{background:var(--ink);color:#fff;padding:10px 0 46px}
.feat h2,.band h2{font-size:clamp(30px,4vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.feat .lead{color:rgba(255,255,255,.7);margin:8px 0 22px;font-size:16px}
.band{color:#fff;position:relative;overflow:hidden;margin-top:34px;scroll-margin-top:58px}
.band .wrap{padding-top:34px;padding-bottom:34px;position:relative}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.06),rgba(22,20,58,.32));pointer-events:none}
.band .num{position:absolute;right:20px;top:-14px;font-size:150px;font-weight:900;letter-spacing:-.05em;opacity:.18;line-height:1}
.band p{font-size:17px;font-weight:300;margin-top:8px;opacity:.95;max-width:640px}
.band .cnt{display:inline-block;margin-top:14px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}}

/* card */
.card{background:#fff;border:1px solid #EFEBE3;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:zoom-in;transition:transform .15s,box-shadow .15s;position:relative;color:var(--ink)}
.card:active{transform:scale(.98)}
@media(hover:hover){.card:hover{box-shadow:0 10px 28px rgba(22,20,58,.12);transform:translateY(-2px)}}
.media{aspect-ratio:1/1;background:#fff;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.media img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain;opacity:0;transition:opacity .3s}
.media img.ok{opacity:1}
.off .media img.ok{opacity:.55;filter:grayscale(.5)}
.ph{font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:-.02em;opacity:.85}
.badge{position:absolute;top:10px;left:10px;z-index:2;background:var(--accent);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:8px}
.body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.name{font-size:14.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pack{font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.code{background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:6px 11px;border-radius:10px;white-space:nowrap}
.code small{font-size:9.5px;opacity:.7;letter-spacing:.1em;font-weight:600;margin-right:2px}
.feat .grid{grid-template-columns:repeat(2,1fr)}
@media(min-width:1000px){.feat .grid{grid-template-columns:repeat(4,1fr)}}
.meta{flex-wrap:wrap}

/* viewer */
.viewer{position:fixed;inset:0;z-index:30;background:rgba(14,12,40,.94);display:none;align-items:center;justify-content:center;padding:20px}
.viewer.on{display:flex}
.vbox{background:#fff;border-radius:22px;width:min(720px,100%);max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.vimg{background:#fff;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px}
.vimg img{max-width:100%;max-height:64vh;object-fit:contain}
.vinfo{padding:6px 22px 20px;border-top:1px solid var(--line)}
.vcat{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-top:12px}
.vinfo h3{font-size:20px;line-height:1.3;margin-top:4px}
.vrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.vrow .code{font-size:18px;padding:8px 14px}
.vrow .pack{font-size:15px}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center}
.nav.prev{left:14px}.nav.next{right:14px}
.vclose{position:fixed;top:14px;right:16px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:28px}
.vpos{position:fixed;top:24px;left:20px;color:rgba(255,255,255,.7);font-size:13px;font-weight:600}
.totop{position:fixed;right:18px;bottom:18px;z-index:9;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(255,122,69,.45);display:none;align-items:center;justify-content:center}
.totop.on{display:flex}
.totop svg{width:22px;height:22px}
.empty{padding:50px 0;text-align:center;color:var(--mute);font-size:16px}
footer{background:var(--ink);color:rgba(255,255,255,.75);text-align:center;padding:40px 20px;margin-top:40px;font-size:15px;line-height:1.6}
footer b{color:#fff;font-size:18px}
/* brand */
.top{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line),0 4px 14px rgba(15,47,102,.06)}
img.logo{height:34px;width:auto;flex:none}
.jump a{color:var(--ink2)}
.jump a.on{background:var(--ink);color:#fff}
.tb{background:#EEF2F8;color:var(--ink)}
.sbox input{border:1px solid var(--line)}
.hero{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.hero .orb{opacity:.07}
.hero .eyebrow{color:var(--mute)}
.hlogo{display:block;width:min(460px,80vw);height:auto;margin:16px 0 0 -6px}
.hero p{color:var(--ink2)}
.stats span{color:var(--mute)}
footer{background:#fff;color:var(--ink2);border-top:1px solid var(--line)}
footer b{color:var(--ink)}
.flogo{height:56px;width:auto;margin-bottom:10px}
/* compact header: hides while scrolling down, comes back when scrolling up */
.top{transition:transform .25s ease;padding-top:env(safe-area-inset-top)}
.top.hide{transform:translateY(-100%)}
@media(max-width:699px){
  .top .wrap{height:48px;gap:8px;padding:0 12px}
  img.logo{height:24px}
  .jump a{padding:6px 10px;font-size:12.5px}
  .tb{width:34px;height:34px;border-radius:10px}
  .tb svg{width:17px;height:17px}
  .sbox{padding:0 12px 8px}
  .sbox input{padding:9px 12px;font-size:16px}
  .wrap{padding:0 12px}
  .grid{gap:10px}
  .body{padding:2px 10px 10px;gap:8px}
  .name{font-size:13.5px}
  .code{font-size:12.5px;padding:5px 9px}
  .pack{font-size:12px}
  .hero{padding:26px 0 30px}
  .band .wrap{padding-top:22px;padding-bottom:22px}
  .band .num{font-size:96px;top:-6px}
}
.body .brand{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:-7px}
@media(max-width:699px){.body .brand{font-size:9.5px;margin-bottom:-5px}}
.badge.nb{background:#1FA35B}
.badge.vb{background:#1270BA}
.newsec{background:#EAF6EF;padding:6px 0 34px;border-bottom:1px solid var(--line)}
.newsec h2{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em;color:#145C36}
.newsec .eyebrow{color:#1FA35B}
.newsec .lead{color:var(--ink2);margin:6px 0 4px;font-size:15px}
.tb.mb{width:auto;padding:0 12px;gap:6px;font-weight:700;font-size:13.5px}
@media(max-width:699px){.tb.mb span{display:none}.tb.mb{width:34px;padding:0}}
.bsheet{position:fixed;inset:0;z-index:25;background:rgba(15,47,102,.45);display:none;align-items:flex-end;justify-content:center}
.bsheet.on{display:flex}
@media(min-width:700px){.bsheet{align-items:center}}
.bbox{background:#fff;width:min(560px,100%);max-height:82vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.bbox{border-radius:20px}}
.bhead{display:flex;align-items:center;justify-content:space-between}
.bhead h3{font-size:20px}
.bhead button{border:0;background:#EEF2F8;width:36px;height:36px;border-radius:50%;font-size:22px;color:var(--ink)}
#bq{margin:12px 0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;outline:none}
.blist{overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.blist button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;text-align:left;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:6px;color:var(--ink)}
.blist button span{color:var(--mute);font-weight:500}
.brsel{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:var(--ink);color:#fff;border-radius:20px;padding:8px 8px 8px 16px;font-size:14px}
.brsel button{border:0;background:rgba(255,255,255,.2);color:#fff;width:26px;height:26px;border-radius:50%;font-size:18px;line-height:1}
/* v2: compact hero */
.hero{padding:22px 0 24px}
.hrow{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.hlogo{width:250px;margin:0}
.hinfo{flex:1;min-width:200px}
.hinfo p{margin-top:6px;font-size:17px}
.hero .stats{margin-top:0;gap:26px}
.hero .stats b{font-size:26px}
.hero .orb{width:340px;top:-90px;right:-110px}
@media(max-width:699px){.hlogo{width:170px}.hrow{gap:14px}.hinfo p{font-size:15px}.hero .stats b{font-size:22px}.hero{padding:16px 0 18px}}
/* v2: thin category bands */
.band{margin-top:26px}
.band .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.band h2{font-size:22px;letter-spacing:-.01em}
.band .cnt{margin-top:0;padding:4px 12px;font-size:12.5px;flex:none}
.band+.sec .grid{margin-top:14px}
@media(max-width:699px){.band h2{font-size:18px}.band .wrap{padding-top:10px;padding-bottom:10px}}
/* v2: carousels */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 10px;margin-top:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 230px;scroll-snap-align:start}
@media(max-width:699px){.rail .card{flex-basis:44vw}.rail{gap:10px}}
.feat{padding:16px 0 26px}
.feat h2,.newsec h2{font-size:clamp(24px,3vw,32px)}
.feat .lead,.newsec .lead{margin:4px 0 0;font-size:14.5px}
.newsec{padding:16px 0 22px}
/* v2: loading placeholder */
.media::before{content:"";position:absolute;inset:10px;border-radius:12px;background:linear-gradient(100deg,#F1EFEA 20%,#F8F7F4 40%,#F1EFEA 60%);background-size:220% 100%;animation:shim 1.3s linear infinite}
.media.ld::before{display:none}
.media:not(:has(img))::before{display:none}
@keyframes shim{to{background-position:-120% 0}}
.rwrap{position:relative}
.rbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:28px;line-height:1;box-shadow:0 4px 14px rgba(15,47,102,.25);display:flex;align-items:center;justify-content:center;padding-bottom:3px}
.rbtn.l{left:-8px}.rbtn.r{right:-8px}
@media(max-width:699px){.rbtn{width:36px;height:36px;font-size:24px}.rbtn.l{left:-4px}.rbtn.r{right:-4px}}
.totop{width:44px;height:44px;bottom:calc(16px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <img class="logo" src="logo.png" alt="Orbita Distribuidora">
    <nav class="jump" id="jump"></nav>
    <button class="tb mb" id="bbtn" aria-label="Marcas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span>Marcas</span></button>
    <button class="tb" id="sbtn" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="tb" id="fbtn" aria-label="Tela cheia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="sbox" id="sbox"><div style="max-width:1280px;margin:0 auto"><input id="q" type="search" placeholder="Buscar por nome ou código…" autocomplete="off"></div></div>
</div>

<header class="hero"><div class="wrap">
  <svg class="orb" viewBox="0 0 120 120"><ellipse cx="60" cy="60" rx="52" ry="20" fill="none" stroke="#1270BA" stroke-width="2.2" transform="rotate(-24 60 60)"/><circle cx="60" cy="60" r="22" fill="#1270BA"/><circle cx="104" cy="40" r="5" fill="#F39C12"/></svg>
  <div class="hrow"><img class="hlogo" src="logo.png" alt="Orbita Distribuidora">
  <div class="hinfo"><div class="eyebrow">CATÁLOGO 2026</div><p>Variedades, beleza e utilidades</p></div>
  <div class="stats"><div><b id="st-n"></b><span>produtos</span></div><div><b id="st-c"></b><span>categorias</span></div><div><b id="st-b"></b><span>marcas</span></div></div></div>
</div></header>

<main id="list"></main>
<footer><img class="flogo" src="logo.png" alt="Orbita Distribuidora"><br>Gostou? Anote os códigos e faça seu pedido.<br><b>WhatsApp (34) 99707-5076</b><br>orbita.pedidook.com.br</footer>

<button class="totop" id="totop" aria-label="Voltar ao topo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg></button>

<div class="bsheet" id="bsheet"><div class="bbox">
  <div class="bhead"><h3>Marcas</h3><button id="bclose" aria-label="Fechar">×</button></div>
  <input id="bq" type="search" placeholder="Procurar marca…" autocomplete="off">
  <div class="blist" id="blist"></div>
</div></div>

<div class="viewer" id="viewer">
  <div class="vpos" id="vpos"></div>
  <button class="vclose" id="vclose" aria-label="Fechar">×</button>
  <button class="nav prev" id="vprev" aria-label="Anterior">‹</button>
  <div class="vbox" id="vbox"></div>
  <button class="nav next" id="vnext" aria-label="Próximo">›</button>
</div>

/* images: one file per category, loaded when the section gets close */
const IMG={},LOADED={};
function fill(root){(root||document).querySelectorAll('img[data-id]:not([src])').forEach(el=>{const u=IMG[el.dataset.id];if(u){el.onload=()=>{el.classList.add('ok');el.parentNode.classList.add('ld')};el.src=u}})}
function loadCat(k){if(LOADED[k])return LOADED[k];return LOADED[k]=fetch(`img/cat-${k}.json`).then(r=>r.json()).then(m=>{Object.assign(IMG,m);fill()}).catch(()=>{delete LOADED[k]})}
const FL={};
function loadF(n){if(FL[n])return;FL[n]=fetch(`img/f-${n}.json`).then(r=>r.json()).then(m=>{Object.assign(IMG,m);fill()}).catch(()=>{delete FL[n]})}
const RAIL=b=>`<div class="rwrap"><button class="rbtn l" aria-label="Anterior">‹</button><div class="rail">${b}</div><button class="rbtn r" aria-label="Próximo">›</button></div>`;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.dataset.k.split(',').forEach(loadCat);io.unobserve(e.target)}}),{rootMargin:'1200px 0px'});

function first(n){const w=n.split(' ').find(x=>/^[A-Za-zÀ-ú]{3,}/.test(x));return w?w.slice(0,11):''}
function card(i,badge){
  const m=i.img?`<img data-id="${i.id}" alt="${esc(i.name)}">`:`<div class="ph" style="color:${COL[i.cat]}">${esc(first(i.name))}</div>`;
  return `<div class="card${i.off?' off':''}" data-id="${i.id}">${badge?'<span class="badge">Mais vendido</span>':''}${i.off?'<span class="badge" style="background:#8C8AA3">Fora de estoque</span>':''}${!badge&&i.news===1?'<span class="badge nb">Novidade</span>':''}${!badge&&i.news===2?'<span class="badge vb">Voltou ao estoque</span>':''}<div class="media">${m}</div><div class="body">${i.brand?`<div class="brand">${esc(i.brand)}</div>`:''}<div class="name">${esc(i.name)}</div><div class="meta"><span class="pack">${esc(i.pack||'')}</span><span class="code"><small>CÓD.</small>${esc(i.code)}</span></div></div></div>`;
}

let order=[], BR='';
/* brand picker */
const BRANDS={};items.forEach(i=>{if(i.brand)BRANDS[i.brand]=(BRANDS[i.brand]||0)+1});
const bnames=Object.keys(BRANDS).sort((a,b)=>BRANDS[b]-BRANDS[a]||a.localeCompare(b,'pt'));
function blist(){const q=norm($('bq').value.trim());$('blist').innerHTML=bnames.filter(b=>!q||norm(b).includes(q)).map(b=>`<button data-b="${esc(b)}">${esc(b)}<span>${BRANDS[b]}</span></button>`).join('')||'<div class="empty">Nenhuma marca.</div>'}
$('bbtn').onclick=()=>{$('bq').value='';blist();$('bsheet').classList.add('on')};
$('bclose').onclick=()=>$('bsheet').classList.remove('on');

$('bq').addEventListener('input',blist);
$('blist').addEventListener('click',e=>{const b=e.target.closest('button[data-b]');if(!b)return;BR=b.dataset.b;$('bsheet').classList.remove('on');render();watch();window.scrollTo({top:$('list').offsetTop-60})});
$('list').addEventListener('click',e=>{if(e.target.id==='brx'){BR='';render();watch();window.scrollTo({top:$('list').offsetTop-60})}});
function render(){
  const nq=norm($('q').value.trim());
  const match=i=>(!BR||i.brand===BR)&&(!nq||nq.split(/\s+/).every(t=>i.k.includes(t)));
  let h='';order=[];
  if(BR){h+=`<div class="wrap"><div class="brsel">Marca: <b>${esc(BR)}</b><button id="brx" aria-label="Limpar marca">×</button></div></div>`}
  if(!nq&&!BR){
    const nw=items.filter(i=>i.news&&!i.off);
    if(nw.length){
      h+=`<section class="newsec" data-k="${[...new Set(nw.map(i=>i.cat))].join(',')}"><div class="wrap"><div class="eyebrow">ATUALIZADO HOJE</div><h2 style="margin-top:6px">Chegou agora</h2><div class="lead">${nw.filter(i=>i.news===1).length} novidades e ${nw.filter(i=>i.news===2).length} produtos que voltaram ao estoque.</div>${RAIL(nw.map(i=>{order.push(i.id);return card(i)}).join(''))}</div></section>`;
    }
  }
  if(!nq&&!BR){
    const f=FEAT.map(id=>byId[id]).filter(Boolean);
    h+=`<section class="feat"><div class="wrap"><div class="eyebrow">TOP VENDAS</div><h2 style="margin-top:8px">Mais vendidos</h2><div class="lead">${f.length} campeões de venda da Orbita. Deslize para ver todos.</div>${RAIL(f.map((i,n)=>{order.push(i.id);return card(i,true).replace('<div class="card','<div data-f="'+Math.floor(n/FCH)+'" class="card')}).join(''))}</div></section>`;
  }
  let any=false;
  for(const k of cats){
    const arr=items.filter(i=>i.cat===k&&match(i));
    if(!arr.length)continue;any=true;
    arr.forEach(i=>order.push(i.id));
    h+=`<section class="band" id="c${k}" data-k="${k}" style="background:${COL[k]}"><div class="wrap"><h2>${esc(C[k][0])}</h2><span class="cnt">${arr.length} ${arr.length===1?"produto":"produtos"}</span></div></section>
    <div class="wrap sec" data-k="${k}" data-c="${k}"><div class="grid">${arr.map(i=>card(i)).join('')}</div></div>`;
  }
  if(!any)h+='<div class="empty">Nenhum produto encontrado.</div>';
  $('list').innerHTML=h;
  document.querySelectorAll('[data-k]').forEach(el=>io.observe(el));
  const fr=document.querySelector('.feat .rail');
  if(fr){const fo=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){loadF(e.target.dataset.f);fo.unobserve(e.target)}}),{root:fr,rootMargin:'0px 900px'});fr.querySelectorAll('[data-f]').forEach(el=>fo.observe(el))}
  fill();
}

/* jump bar */

const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const k=e.target.dataset.c;document.querySelectorAll('.jump a').forEach(a=>{const on=a.dataset.c===k;a.classList.toggle('on',on);if(on)a.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})})}}),{rootMargin:'-45% 0px -50% 0px'});
const watch=()=>document.querySelectorAll('.sec,.band').forEach(el=>{if(!el.dataset.c)el.dataset.c=el.id.slice(1);spy.observe(el)});

if(!document.documentElement.requestFullscreen||matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('fbtn').style.display='none';
$('fbtn').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
let lastY=0;
window.addEventListener('scroll',()=>{
  const y=scrollY;$('totop').classList.toggle('on',y>900);
  const top=document.querySelector('.top');
  if(y>lastY+8&&y>140){top.classList.add('hide');if(!$('q').value&&$('sbox').classList.contains('on')){$('sbox').classList.remove('on');$('q').blur()}}
  else if(y<lastY-8||y<140)top.classList.remove('hide');
  lastY=y;
},{passive:true});
document.querySelectorAll('.jump').forEach(j=>j.addEventListener('click',()=>setTimeout(()=>document.querySelector('.top').classList.add('hide'),700)));
$('totop').onclick=()=>window.scrollTo({top:0});

/* viewer with previous / next */
let cur=-1;
function show(idx){
  if(idx<0||idx>=order.length)return;cur=idx;const i=byId[order[idx]];
  loadCat(i.cat).then(()=>{if(order[cur]!==i.id)return;
    $('vbox').innerHTML=`<div class="vimg">${i.img&&IMG[i.id]?`<img src="${IMG[i.id]}" alt="">`:`<div class="ph" style="color:${COL[i.cat]};font-size:40px;padding:80px 0">${esc(first(i.name))}</div>`}</div><div class="vinfo"><div class="vcat" style="color:${COL[i.cat]}">${esc(C[i.cat][0])}${i.brand?` <span style="color:var(--mute)">· ${esc(i.brand)}</span>`:''}</div><h3>${esc(i.name)}</h3><div class="vrow"><span class="pack">${esc(i.pack||'')}</span><span class="code"><small>CÓD.</small>${esc(i.code)}</span></div></div>`;
    $('vpos').textContent=`${idx+1} de ${order.length}`;});
  $('viewer').classList.add('on');
}
$('list').addEventListener('click',e=>{const b=e.target.closest('.rbtn');if(b){const r=b.parentNode.querySelector('.rail');r.scrollBy({left:(b.classList.contains('l')?-1:1)*r.clientWidth*.9,behavior:'smooth'});return}});
$('list').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)show(order.indexOf(c.dataset.id))});
const close=()=>$('viewer').classList.remove('on');
$('vclose').onclick=close;$('vprev').onclick=()=>show(cur-1);$('vnext').onclick=()=>show(cur+1);
$('viewer').addEventListener('click',e=>{if(e.target.id==='viewer')close()});
document.addEventListener('keydown',e=>{if(!$('viewer').classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
let sx=null;$('viewer').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('viewer').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));sx=null});

render();watch();
</script>
</body>
</html>
